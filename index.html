<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TaksiGo</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="shortcut icon" href="./icon-192.png">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; overscroll-behavior:none; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:3px; }
  input, select, textarea { -webkit-appearance:none; }
  @media(max-width:760px) {
    .desktop-sidebar { display:none !important; }
    .bottom-nav { display:flex !important; }
    .content-area { padding-bottom:76px !important; }
  }
  .bottom-nav { display:none; }
</style>
</head>
<body>
<div id="root"></div>
<!-- Per-customer config — the only file that should ever differ between deployments -->
<script src="./config.js?v=1"></script>
<!-- Shared app code — identical for every customer. See APP-OVERVIEW.md.
     Bump ?v= here whenever app.js changes so it's re-fetched, not stuck in cache. -->
<script src="./app.js?v=1"></script>
</body>
</html>
